<div class="container">
    <p class="title">Filters</p>

    <!-- 🔵 Category -->
    <div class="categories">
        <p>Category</p>

        <form [formGroup]="forms[0]">
        <div class="category">
            <input type="checkbox" id="electronics" formControlName="electronics">
            <label for="electronics">Electronics</label>
        </div>

        <div class="category">
            <input type="checkbox" id="accessories" formControlName="accessories">
            <label for="accessories">Accessories</label>
        </div>

        <div class="category">
            <input type="checkbox" id="footwear" formControlName="footwear">
            <label for="footwear">Footwear</label>
        </div>

        <div class="category">
            <input type="checkbox" id="home" formControlName="home">
            <label for="home">Home & Kitchen</label>
        </div>

        <div class="category">
            <input type="checkbox" id="sports" formControlName="sports">
            <label for="sports">Sports & Fitness</label>
        </div>
        </form>
    </div>

    <!-- 🔵 Ratings -->
    <div class="ratings">
        <p>Minimum Rating</p>

        <form [formGroup]="forms[1]">
        <div class="rating">
            <input type="checkbox" id="rating4" formControlName="rating4">
            <label for="rating4">4 Stars & Up</label>
        </div>

        <div class="rating">
            <input type="checkbox" id="rating3" formControlName="rating3">
            <label for="rating3">3 Stars & Up</label>
        </div>

        <div class="rating">
            <input type="checkbox" id="rating2" formControlName="rating2">
            <label for="rating2">2 Stars & Up</label>
        </div>

        <div class="rating">
            <input type="checkbox" id="rating1" formControlName="rating1">
            <label for="rating1">1 Star & Up</label>
        </div>
        </form>
    </div>

    <!-- 🔵 Availability -->
    <div class="availability">
        <p>Availability</p>

        <form [formGroup]="forms[2]">
        <div class="available">
            <input type="checkbox" id="inStock" formControlName="inStock">
            <label for="inStock">In Stock</label>
        </div>
        </form>
    </div>

    <!-- 🔴 Clear Button -->
    <button class="clear-btn" (click)="clearAll()">Clear Filters</button>
</div>
