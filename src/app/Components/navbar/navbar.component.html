
<nav class="navbar">

    <!-- Logo -->
    <div class="logo">
        <a routerLink="/home">E-Commerce</a>
    </div>

    <!-- Desktop Navigation -->
    <div class="links">
        <a routerLink="/home">Home</a>
        <a routerLink="/products">Products</a>
    </div>

    <!-- Right Side Icons -->
    <div class="navbar-actions">

        <!-- Cart -->
        <a routerLink="/cart" class="icon-link">
            <i class="fa-solid fa-cart-shopping"></i>

            @if (count > 0) {
                <span class="counter">{{ count }}</span>
            }
        </a>


        <!-- Profile -->
        @if (isLoggedIn) {
            <i
                class="fa-solid fa-user profile"
                routerLink="/profile">
            </i>
        }



        <!-- Hamburger -->
        <button
            class="menu-toggle"
            type="button"
            (click)="toggleMenu()"
            [class.active]="menuOpen"
            [attr.aria-expanded]="menuOpen"
            aria-label="Toggle navigation menu">
            <i class="fa-solid fa-bars"></i>
        </button>

    </div>

    <!-- Mobile Menu -->
    <div class="mobile-menu" [class.open]="menuOpen">

        <a
            routerLink="/home"
            (click)="closeMenu()">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>

        <a
            routerLink="/products"
            (click)="closeMenu()">
            <i class="fa-solid fa-box"></i>
            <span>Products</span>
        </a>

        @if (isLoggedIn) {
            <button
                type="button"
                class="logout-btn"
                (click)="logout()">

                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Logout</span>
            </button>
        } @else {
            <a
                routerLink="/login"
                (click)="closeMenu()">

                <i class="fa-solid fa-right-to-bracket"></i>
                <span>Login</span>
            </a>
        }

    </div>

</nav>
