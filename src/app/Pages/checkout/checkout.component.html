<div class="container">

  <h1>Checkout</h1>

  <div class="checkout-content">

    <!-- LEFT SIDE -->
    <div class="checkout-left">

      <!-- Billing -->
      <div class="card">
        <h2>Billing Information</h2>

        <div class="form-group">
          <label>Full Name *</label>
          <input [(ngModel)]="form.fullName" placeholder="John Doe" />
        </div>

        <div class="form-group">
          <label>Email *</label>
          <input [(ngModel)]="form.email" type="email" placeholder="user@example.com" />
        </div>

        <div class="form-group">
          <label>Address *</label>
          <input [(ngModel)]="form.address" />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>City *</label>
            <input [(ngModel)]="form.city" />
          </div>

          <div class="form-group">
            <label>ZIP Code *</label>
            <input [(ngModel)]="form.zip" />
          </div>
        </div>

        <div class="form-group">
          <label>Country *</label>
          <input [(ngModel)]="form.country" />
        </div>

      </div>

      <!-- Payment -->
      <div class="card">
        <h2>Payment Method</h2>

        <div
          class="payment-option"
          [class.selected]="paymentMethod === 'card'"
          (click)="selectPayment('card')"
        >
          <span class="radio-dot"></span>
          Credit / Debit Card
        </div>

        <div
          class="payment-option"
          [class.selected]="paymentMethod === 'cod'"
          (click)="selectPayment('cod')"
        >
          <span class="radio-dot"></span>
          Cash on Delivery
        </div>

        <!-- CARD FIELDS -->
        <div class="card-fields" *ngIf="paymentMethod === 'card'">

          <div class="form-group">
            <label>Card Number *</label>
            <input [(ngModel)]="form.cardNumber" />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Expiry</label>
              <input [(ngModel)]="form.expiry" placeholder="MM/YY" />
            </div>

            <div class="form-group">
              <label>CVV</label>
              <input [(ngModel)]="form.cvv" />
            </div>
          </div>

        </div>

      </div>

    </div>

    <!-- RIGHT SIDE -->
    <div class="summary-section">

      <div class="summary-card">

        <h2>Order Summary</h2>

        <div class="summary-item" *ngFor="let item of cartItems">
          <img [src]="item.product.image" />

          <div class="summary-item-info">
            <p class="summary-item-name">{{ item.product.title }}</p>
            <p class="summary-item-qty">Qty: {{ item.quantity }}</p>
          </div>

          <span class="summary-item-price">
            ${{ item.product.price * item.quantity }}
          </span>
        </div>

        <hr />

        <div class="summary-row">
          <span>Subtotal</span>
          <span>${{ total }}</span>
        </div>

        <div class="summary-row">
          <span>Shipping</span>
          <span>Free</span>
        </div>

        <hr />

        <div class="summary-row total">
          <span>Total</span>
          <span>${{ total }}</span>
        </div>

        <button class="btn-place-order" (click)="placeOrder()">
          Place Order
        </button>

      </div>

    </div>

  </div>

  <app-alert
    [isOpen]="isOpen"
    [message]="message"
    [title]="title"
    [type]="type"
    (closed)="closeAlert()"></app-alert>
</div>
