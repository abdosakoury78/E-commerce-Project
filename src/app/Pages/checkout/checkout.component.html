<div class="container">

  <h1>Checkout</h1>

  <div class="checkout-content">

    <!-- LEFT SIDE -->
    <div class="checkout-left">

      <form [formGroup]="form">

        <!-- Billing -->
        <div class="card">
          <h2>Billing Information</h2>

          <div class="form-group">
            <label>Full Name *</label>
            <input
              type="text"
              placeholder="Enter your full name"
              formControlName="name">
          </div>

          <div class="form-group">
            <label>Email *</label>
            <input
              type="email"
              placeholder="user@example.com"
              formControlName="email">
          </div>

          <div class="form-group">
            <label>Address *</label>
            <input formControlName="address">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>City *</label>
              <input formControlName="city">
            </div>

            <div class="form-group">
              <label>ZIP Code *</label>
              <input formControlName="zip">
            </div>
          </div>

          <div class="form-group">
            <label>Country *</label>
            <input formControlName="country">
          </div>

        </div>

        <!-- Payment -->
        <div class="card">

          <h2>Payment Method</h2>

          <div
            class="payment-option"
            [class.selected]="paymentMethod === 'card'"
            (click)="selectPayment('card')">

            <span class="radio-dot"></span>
            Credit / Debit Card
          </div>

          <div
            class="payment-option"
            [class.selected]="paymentMethod === 'cod'"
            (click)="selectPayment('cod')">

            <span class="radio-dot"></span>
            Cash on Delivery
          </div>

          <div class="card-fields" *ngIf="paymentMethod === 'card'">

            <div class="form-group">
              <label>Card Number *</label>
              <input formControlName="cardNumber">
            </div>

            <div class="form-row">

              <div class="form-group">
                <label>Expiry *</label>
                <input
                  placeholder="MM/YY"
                  formControlName="expiry">
              </div>

              <div class="form-group">
                <label>CVV *</label>
                <input formControlName="cvv">
              </div>

            </div>

          </div>

        </div>

      </form>

    </div>

    <!-- RIGHT SIDE -->
    <div class="summary-section">

      <div class="summary-card">

        <h2>Order Summary</h2>

        <div class="summary-item" *ngFor="let item of cartItems">

          <img [src]="item.product.image">

          <div class="summary-item-info">
            <p class="summary-item-name">{{ item.product.title }}</p>
            <p class="summary-item-qty">
              Qty: {{ item.quantity }}
            </p>
          </div>

          <span class="summary-item-price">
            ${{ item.product.price * item.quantity }}
          </span>

        </div>

        <hr>

        <div class="summary-row">
          <span>Subtotal</span>
          <span>${{ total.toFixed(2) }}</span>
        </div>

        <div class="summary-row">
          <span>Shipping</span>
          <span>Free</span>
        </div>

        <hr>

        <div class="summary-row total">
          <span>Total</span>
          <span>${{ total.toFixed(2) }}</span>
        </div>

        <button
          class="btn-place-order"
          (click)="placeOrder()">

          Place Order
        </button>

      </div>

    </div>

  </div>

  <app-alert
    [isOpen]="isOpen"
    [message]="message"
    [title]="title"
    [type]="type"
    (closed)="closeAlert()">
  </app-alert>

</div>
