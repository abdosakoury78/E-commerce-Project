<div class="auth-page">

  <!-- LEFT PANEL -->
  <div class="auth-panel">
    <div class="panel-content">

      <div class="brand-logo">
        <span class="logo-icon">⬛</span>
        <span class="logo-text">ShopNow</span>
      </div>

      <h2 class="panel-heading">Welcome back.</h2>
      <p class="panel-sub">
        Log in to access your orders, wishlist, and personalized picks.
      </p>

      <div class="panel-decoration">
        <div class="deco-circle c1"></div>
        <div class="deco-circle c2"></div>
        <div class="deco-circle c3"></div>
      </div>

    </div>
  </div>

  <!-- RIGHT FORM -->
  <div class="auth-form-side">

    <div class="auth-form-box">

      <h1>Log In</h1>

      <p class="auth-sub">
        Don't have an account?
        <a routerLink="/signup">Sign up</a>
      </p>

      <form (ngSubmit)="login()">

        <div class="form-group">
          <label>Email *</label>
          <input
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="user@example.com"
            required
          />
        </div>

        <div class="form-group">
          <label>Password *</label>

          <div class="password-wrapper">
            <input
              [type]="showPassword ? 'text' : 'password'"
              [(ngModel)]="password"
              name="password"
              placeholder="••••••••"
              required
            />

            <button type="button" class="toggle-pw" (click)="togglePassword()">
              👁
            </button>
          </div>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe" />
            Remember me
          </label>

          <a class="forgot">Forgot password?</a>
        </div>

        <button class="btn-submit" type="submit">
          Log In
        </button>

      </form>

    </div>

  </div>

</div>
