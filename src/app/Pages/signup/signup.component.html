<div class="container">
  <div class="box-login">

    <h1>Create Account</h1>
    <p class="subtitle">Sign up to start shopping</p>

    <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">

      <!-- Name -->
      <div class="input-box">
        <label for="name">Full Name</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Enter your full name"
          formControlName="username"
        >
      </div>

      <!-- Email -->
      <div class="input-box">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
          formControlName="email"
        >
      </div>

      <!-- Password -->
      <div class="input-box">
        <label for="password">Password</label>

        <div class="password-box">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            formControlName="password"
          >

        </div>
      </div>

      <!-- Confirm Password -->
      <div class="input-box">
        <label for="confirmPassword">Confirm Password</label>

        <div class="password-box">
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Confirm your password"
            formControlName="confirmPassword"
          >

        </div>
      </div>

      <!-- instructions -->
      <div class="instructions">
        <p>Email must:</p>
        <ul>
          <li [class.green] = "emailValid">
            Be a valid email format (example&#64;gmail.com)
          </li>
        </ul>
        <p>Password must:</p>
        <ul>
          <li [class.green] = "password6Chars">Be at least 6 characters long</li>
          <li [class.green] = "passwordIncludesLetter">Include at least one letter</li>
          <li [class.green] = "passwordIncludesNumber">Include at least one number</li>
        </ul>
      </div>

      <button class="btn-login" [disabled]="disabled">Create Account</button>

    </form>

    <p class="register-text">
      Already have an account?
      <a routerLink="/login">Login here</a>
    </p>

  </div>

    <app-alert
    [isOpen]="isOpen"
    [message]="message"
    [title]="title"
    [type]="type"
    (closed)="closeAlert()"></app-alert>
</div>
